<svg xmlns="http://www.w3.org/2000/svg" width="760" height="493" viewBox="0 0 760 493" role="img" aria-labelledby="title description" xml:lang="ja">
<title id="title">報告が訂正されると、何を再確認するか</title><desc id="description">CL-001のPDFを使った操作例。後日の検査完了報告を訂正すると、終了済みの症例は再確認の対象になります。最初の受診報告と以前の終了判断も残ります。</desc>
<rect width="760" height="493" rx="8" fill="#FFFFFF"/>
<g font-family="Arial, Helvetica, Hiragino Kaku Gothic ProN, Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif">
<text x="24" y="28" fill="#406783" font-size="16" font-weight="700">CL-001  /  PDFを使った操作例</text>
<text x="24" y="66" fill="#203653" font-size="30" font-weight="700">報告が訂正されると、何を再確認するか</text>
<text x="46" y="111" fill="#566579" font-size="18" font-weight="700">報告の内容</text>
<text x="402" y="111" fill="#566579" font-size="18" font-weight="700">担当者の対応</text>
<rect x="24" y="124" width="712" height="99" rx="6" fill="#F8F9FB" stroke="#D9E1E9"/>
<rect x="24" y="129" width="4" height="89" rx="2" fill="#244E95"/>
<text x="46" y="151" fill="#244E95" font-size="20" font-weight="700">最初の受診報告</text>
<text x="402" y="151" fill="#244E95" font-size="20" font-weight="700">フォローを継続</text>
<path d="M365 173 h17 m-5 -5 5 5 -5 5" fill="none" stroke="#244E95" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="46" y="176" fill="#27394C" font-size="18" font-weight="400">患者さんは受診。</text>
<text x="46" y="196" fill="#27394C" font-size="18" font-weight="400">検査は未実施。</text>
<text x="402" y="176" fill="#27394C" font-size="18" font-weight="400">次の対応と、それを担当する</text>
<text x="402" y="196" fill="#27394C" font-size="18" font-weight="400">チームを記録します。</text>
<rect x="24" y="233" width="712" height="99" rx="6" fill="#F8FBF9" stroke="#D9E1E9"/>
<rect x="24" y="238" width="4" height="89" rx="2" fill="#246B4E"/>
<text x="46" y="260" fill="#246B4E" font-size="20" font-weight="700">後日の検査完了報告</text>
<text x="402" y="260" fill="#246B4E" font-size="20" font-weight="700">確認を経てフォローを終了</text>
<path d="M365 282 h17 m-5 -5 5 5 -5 5" fill="none" stroke="#246B4E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="46" y="285" fill="#27394C" font-size="18" font-weight="400">必要な検査手順をすべて実施</text>
<text x="46" y="305" fill="#27394C" font-size="18" font-weight="400">したとの報告を追加します。</text>
<text x="402" y="285" fill="#27394C" font-size="18" font-weight="400">必要な確認がすべてそろうと、</text>
<text x="402" y="305" fill="#27394C" font-size="18" font-weight="400">医師が終了を承認できます。</text>
<rect x="24" y="342" width="712" height="99" rx="6" fill="#FBFAF8" stroke="#D9E1E9"/>
<rect x="24" y="347" width="4" height="89" rx="2" fill="#956B24"/>
<text x="46" y="369" fill="#956B24" font-size="20" font-weight="700">後日の検査完了報告を訂正</text>
<text x="402" y="369" fill="#956B24" font-size="20" font-weight="700">症例を再び確認</text>
<path d="M365 391 h17 m-5 -5 5 5 -5 5" fill="none" stroke="#956B24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="46" y="394" fill="#27394C" font-size="18" font-weight="400">実施したのは最初の段階のみで、</text>
<text x="46" y="414" fill="#27394C" font-size="18" font-weight="400">残りの手順は未実施でした。</text>
<text x="402" y="394" fill="#27394C" font-size="18" font-weight="400">検査実施の根拠、医師による結果の</text>
<text x="402" y="414" fill="#27394C" font-size="18" font-weight="400">確認、患者さんへの方針説明の</text>
<text x="402" y="434" fill="#27394C" font-size="18" font-weight="400">3項目を再確認します。</text>
<path d="M24 454H736" stroke="#D9E1E9"/>
<text x="24" y="481" fill="#283C53" font-size="18" font-weight="700">3件の報告と、以前の終了判断は、すべて記録に残ります。</text>
</g></svg>
