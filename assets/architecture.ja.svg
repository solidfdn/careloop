<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="652" height="535" viewBox="0 0 652 535" role="img" aria-labelledby="title description" xml:lang="ja">
  <title id="title">CareLoop のシステム構成</title>
  <desc id="description">担当者と患者の画面はFastAPIを通じて症例記録とPDFを参照します。Geminiは対象範囲の記録や引用を選び、APIが照合します。フォローの終了は医師が承認し、APIが必要条件を確認します。</desc>
  <rect width="652" height="535" fill="white"/>
  <polyline points="141,229 141,275" fill="none" stroke="#566579" stroke-width="2.2" stroke-linejoin="round"/>
  <polygon points="141,229 145.2,237.0 136.8,237.0" fill="#566579"/>
  <polygon points="141,275 136.8,267.0 145.2,267.0" fill="#566579"/>
  <polyline points="266,302 287,302 287,123 325,123" fill="none" stroke="#566579" stroke-width="2.2" stroke-linejoin="round"/>
  <polygon points="266,302 274.0,297.8 274.0,306.2" fill="#566579"/>
  <polygon points="325,123 317.0,127.2 317.0,118.8" fill="#566579"/>
  <polyline points="266,356 302,356 302,248 325,248" fill="none" stroke="#566579" stroke-width="2.2" stroke-linejoin="round"/>
  <polygon points="266,356 274.0,351.8 274.0,360.2" fill="#566579"/>
  <polygon points="325,248 317.0,252.2 317.0,243.8" fill="#566579"/>
  <polyline points="266,424 325,424" fill="none" stroke="#566579" stroke-width="2.2" stroke-linejoin="round"/>
  <polygon points="266,424 274.0,419.8 274.0,428.2" fill="#566579"/>
  <polygon points="325,424 317.0,428.2 317.0,419.8" fill="#566579"/>
  <rect x="17" y="68" width="249" height="161" rx="8" fill="#F8F9FB" stroke="#7F95B6" stroke-width="1.5"/>
  <rect x="17" y="275" width="249" height="198" rx="8" fill="#F3F6FB" stroke="#244E95" stroke-width="1.5"/>
  <rect x="325" y="68" width="310" height="106" rx="8" fill="#F8FAFC" stroke="#8294A5" stroke-width="1.5"/>
  <rect x="325" y="191" width="310" height="123" rx="8" fill="#F8FAFC" stroke="#8294A5" stroke-width="1.5"/>
  <rect x="325" y="331" width="310" height="190" rx="8" fill="#F8FBF9" stroke="#598571" stroke-width="1.5"/>
  <text x="17" y="41" font-family="Arial, &quot;Noto Sans CJK JP&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="28" font-weight="700" fill="#21364E">CareLoop のシステム構成</text>
  <text x="31" y="100" font-family="Arial, &quot;Noto Sans CJK JP&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="22" font-weight="700" fill="#244E95">ブラウザ（React）</text>
  <text x="31" y="130" font-family="Arial, &quot;Noto Sans CJK JP&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="18.5" font-weight="400" fill="#344B60">ケア担当者の画面と</text>
  <text x="31" y="154" font-family="Arial, &quot;Noto Sans CJK JP&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="18.5" font-weight="400" fill="#344B60">患者用の画面</text>
  <text x="31" y="183" font-family="Arial, &quot;Noto Sans CJK JP&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="18.5" font-weight="400" fill="#344B60">医師がフォローの</text>
  <text x="31" y="207" font-family="Arial, &quot;Noto Sans CJK JP&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="18.5" font-weight="400" fill="#344B60">終了を承認する。</text>
  <text x="31" y="309" font-family="Arial, &quot;Noto Sans CJK JP&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="20" font-weight="700" fill="#244E95">Cloud Run 上の FastAPI</text>
  <text x="31" y="340" font-family="Arial, &quot;Noto Sans CJK JP&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="18.5" font-weight="400" fill="#344B60">作業領域、操作権限、</text>
  <text x="31" y="364" font-family="Arial, &quot;Noto Sans CJK JP&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="18.5" font-weight="400" fill="#344B60">記録の版を確認する。</text>
  <text x="31" y="403" font-family="Arial, &quot;Noto Sans CJK JP&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="18.5" font-weight="400" fill="#344B60">引用元を照合し、</text>
  <text x="31" y="427" font-family="Arial, &quot;Noto Sans CJK JP&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="18.5" font-weight="400" fill="#344B60">終了に必要な条件を</text>
  <text x="31" y="451" font-family="Arial, &quot;Noto Sans CJK JP&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="18.5" font-weight="400" fill="#344B60">確認する。</text>
  <text x="340" y="101" font-family="Arial, &quot;Noto Sans CJK JP&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="22" font-weight="700" fill="#21364E">Firestore</text>
  <text x="340" y="131" font-family="Arial, &quot;Noto Sans CJK JP&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="18.5" font-weight="400" fill="#344B60">症例、担当、次の対応、</text>
  <text x="340" y="155" font-family="Arial, &quot;Noto Sans CJK JP&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="18.5" font-weight="400" fill="#344B60">判断履歴を読み書きする。</text>
  <text x="340" y="223" font-family="Arial, &quot;Noto Sans CJK JP&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="22" font-weight="700" fill="#21364E">Cloud Storage</text>
  <text x="340" y="251" font-family="Arial, &quot;Noto Sans CJK JP&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="18.5" font-weight="400" fill="#344B60">PDFを保存する。指定した版を</text>
  <text x="340" y="275" font-family="Arial, &quot;Noto Sans CJK JP&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="18.5" font-weight="400" fill="#344B60">取得し、APIでハッシュ値を</text>
  <text x="340" y="299" font-family="Arial, &quot;Noto Sans CJK JP&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="18.5" font-weight="400" fill="#344B60">照合する。</text>
  <text x="340" y="362" font-family="Arial, &quot;Noto Sans CJK JP&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="22" font-weight="700" fill="#246B4E">Vertex AI 上の Gemini</text>
  <text x="340" y="386" font-family="Arial, &quot;Noto Sans CJK JP&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="18.5" font-weight="400" fill="#344B60">対象範囲の記録を受け取る。</text>
  <text x="340" y="419" font-family="Arial, &quot;Noto Sans CJK JP&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="18" font-weight="700" fill="#246B4E">症例・患者一覧への質問</text>
  <text x="340" y="443" font-family="Arial, &quot;Noto Sans CJK JP&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="18.5" font-weight="400" fill="#344B60">該当する記録と引用箇所を選ぶ。</text>
  <text x="340" y="478" font-family="Arial, &quot;Noto Sans CJK JP&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="18" font-weight="700" fill="#246B4E">資料の確認（任意）</text>
  <text x="340" y="502" font-family="Arial, &quot;Noto Sans CJK JP&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="18.5" font-weight="400" fill="#344B60">確認候補と根拠の一文を返す。</text>
</svg>
