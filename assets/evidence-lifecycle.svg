<svg xmlns="http://www.w3.org/2000/svg" width="760" height="493" viewBox="0 0 760 493" role="img" aria-labelledby="title description" xml:lang="en">
<title id="title">How a correction reopens a case</title><desc id="description">In the CL-001 PDF exercise, a correction to the later completion report reopens a closed case. The original visit report and the closure decision remain in the record.</desc>
<rect width="760" height="493" rx="8" fill="#FFFFFF"/>
<g font-family="Arial, Helvetica, Hiragino Kaku Gothic ProN, Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif">
<text x="24" y="28" fill="#406783" font-size="16" font-weight="700">CL-001  /  PDF exercise</text>
<text x="24" y="66" fill="#203653" font-size="30" font-weight="700">How a correction reopens a case</text>
<text x="46" y="111" fill="#566579" font-size="18" font-weight="700">What the report says</text>
<text x="402" y="111" fill="#566579" font-size="18" font-weight="700">What the care team does</text>
<rect x="24" y="124" width="712" height="99" rx="6" fill="#F8F9FB" stroke="#D9E1E9"/>
<rect x="24" y="129" width="4" height="89" rx="2" fill="#244E95"/>
<text x="46" y="151" fill="#244E95" font-size="20" font-weight="700">First visit</text>
<text x="402" y="151" fill="#244E95" font-size="20" font-weight="700">Keep follow-up open</text>
<path d="M365 173 h17 m-5 -5 5 5 -5 5" fill="none" stroke="#244E95" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="46" y="176" fill="#27394C" font-size="18" font-weight="400">The patient attended. The</text>
<text x="46" y="196" fill="#27394C" font-size="18" font-weight="400">procedure was not performed.</text>
<text x="402" y="176" fill="#27394C" font-size="18" font-weight="400">Record the next action and</text>
<text x="402" y="196" fill="#27394C" font-size="18" font-weight="400">the team responsible.</text>
<rect x="24" y="233" width="712" height="99" rx="6" fill="#F8FBF9" stroke="#D9E1E9"/>
<rect x="24" y="238" width="4" height="89" rx="2" fill="#246B4E"/>
<text x="46" y="260" fill="#246B4E" font-size="20" font-weight="700">Later completion report</text>
<text x="402" y="260" fill="#246B4E" font-size="20" font-weight="700">Review before closure</text>
<path d="M365 282 h17 m-5 -5 5 5 -5 5" fill="none" stroke="#246B4E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="46" y="285" fill="#27394C" font-size="18" font-weight="400">A new report says all required</text>
<text x="46" y="305" fill="#27394C" font-size="18" font-weight="400">steps were completed.</text>
<text x="402" y="285" fill="#27394C" font-size="18" font-weight="400">The clinician can close the case</text>
<text x="402" y="305" fill="#27394C" font-size="18" font-weight="400">after the required checks pass.</text>
<rect x="24" y="342" width="712" height="99" rx="6" fill="#FBFAF8" stroke="#D9E1E9"/>
<rect x="24" y="347" width="4" height="89" rx="2" fill="#956B24"/>
<text x="46" y="369" fill="#956B24" font-size="20" font-weight="700">Correction to the later report</text>
<text x="402" y="369" fill="#956B24" font-size="20" font-weight="700">Reopen for review</text>
<path d="M365 391 h17 m-5 -5 5 5 -5 5" fill="none" stroke="#956B24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="46" y="394" fill="#27394C" font-size="18" font-weight="400">Only the first stage was done.</text>
<text x="46" y="414" fill="#27394C" font-size="18" font-weight="400">Other required steps are pending.</text>
<text x="402" y="394" fill="#27394C" font-size="18" font-weight="400">Recheck procedure evidence,</text>
<text x="402" y="414" fill="#27394C" font-size="18" font-weight="400">result review and communication</text>
<text x="402" y="434" fill="#27394C" font-size="18" font-weight="400">of the plan.</text>
<path d="M24 454H736" stroke="#D9E1E9"/>
<text x="24" y="481" fill="#283C53" font-size="18" font-weight="700">CareLoop keeps all three reports and the earlier closure decision.</text>
</g></svg>
