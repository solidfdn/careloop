  <text x="17" y="41" font-family="Arial, &quot;Noto Sans CJK JP&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="28" font-weight="700" fill="#21364E">CareLoop system architecture</text>
  <text x="31" y="100" font-family="Arial, &quot;Noto Sans CJK JP&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="22" font-weight="700" fill="#244E95">Browser · React</text>
  <text x="31" y="130" font-family="Arial, &quot;Noto Sans CJK JP&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="18.5" font-weight="400" fill="#344B60">Care-team workspace</text>
  <text x="31" y="154" font-family="Arial, &quot;Noto Sans CJK JP&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="18.5" font-weight="400" fill="#344B60">and Patient Navigator.</text>
  <text x="31" y="183" font-family="Arial, &quot;Noto Sans CJK JP&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="18.5" font-weight="400" fill="#344B60">A clinician approves</text>
  <text x="31" y="207" font-family="Arial, &quot;Noto Sans CJK JP&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="18.5" font-weight="400" fill="#344B60">follow-up closure.</text>
  <text x="31" y="309" font-family="Arial, &quot;Noto Sans CJK JP&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="21" font-weight="700" fill="#244E95">FastAPI on Cloud Run</text>
  <text x="31" y="340" font-family="Arial, &quot;Noto Sans CJK JP&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="18.5" font-weight="400" fill="#344B60">Checks workspace, role</text>
  <text x="31" y="364" font-family="Arial, &quot;Noto Sans CJK JP&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="18.5" font-weight="400" fill="#344B60">and record version.</text>
  <text x="31" y="403" font-family="Arial, &quot;Noto Sans CJK JP&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="18.5" font-weight="400" fill="#344B60">Verifies source references</text>
  <text x="31" y="427" font-family="Arial, &quot;Noto Sans CJK JP&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="18.5" font-weight="400" fill="#344B60">and enforces the checks</text>
  <text x="31" y="451" font-family="Arial, &quot;Noto Sans CJK JP&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="18.5" font-weight="400" fill="#344B60">required for closure.</text>
  <text x="340" y="101" font-family="Arial, &quot;Noto Sans CJK JP&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="22" font-weight="700" fill="#21364E">Firestore</text>
  <text x="340" y="131" font-family="Arial, &quot;Noto Sans CJK JP&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="18.5" font-weight="400" fill="#344B60">Reads and writes cases, owners,</text>
  <text x="340" y="155" font-family="Arial, &quot;Noto Sans CJK JP&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="18.5" font-weight="400" fill="#344B60">next actions and decision history.</text>
  <text x="340" y="223" font-family="Arial, &quot;Noto Sans CJK JP&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="22" font-weight="700" fill="#21364E">Cloud Storage</text>
  <text x="340" y="251" font-family="Arial, &quot;Noto Sans CJK JP&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="18.5" font-weight="400" fill="#344B60">Stores and retrieves original</text>
  <text x="340" y="275" font-family="Arial, &quot;Noto Sans CJK JP&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="18.5" font-weight="400" fill="#344B60">PDFs by object version.</text>
  <text x="340" y="299" font-family="Arial, &quot;Noto Sans CJK JP&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="18.5" font-weight="400" fill="#344B60">The API verifies the file hash.</text>
  <text x="340" y="362" font-family="Arial, &quot;Noto Sans CJK JP&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="22" font-weight="700" fill="#246B4E">Gemini on Vertex AI</text>
  <text x="340" y="386" font-family="Arial, &quot;Noto Sans CJK JP&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="18.5" font-weight="400" fill="#344B60">Receives records in scope.</text>
  <text x="340" y="419" font-family="Arial, &quot;Noto Sans CJK JP&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="18" font-weight="700" fill="#246B4E">Case and worklist questions</text>
  <text x="340" y="443" font-family="Arial, &quot;Noto Sans CJK JP&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="18.5" font-weight="400" fill="#344B60">Selects record IDs and passages.</text>
  <text x="340" y="478" font-family="Arial, &quot;Noto Sans CJK JP&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="18" font-weight="700" fill="#246B4E">Optional document review</text>
  <text x="340" y="502" font-family="Arial, &quot;Noto Sans CJK JP&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="18.5" font-weight="400" fill="#344B60">Returns findings with quotations.</text>
