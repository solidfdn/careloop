<svg xmlns="http://www.w3.org/2000/svg" width="652" height="535" viewBox="0 0 652 535" role="img" aria-labelledby="title description" xml:lang="en">
  <title id="title">CareLoop system architecture</title>
  <desc id="description">The staff and patient browser connects to the FastAPI service. Only the API accesses Firestore, Cloud Storage and Gemini. It validates sources and enforces the requirements for clinician-approved closure.</desc>
